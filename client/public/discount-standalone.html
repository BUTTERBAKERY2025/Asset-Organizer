<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كارد الخصم - ButterBakery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 400px;
    }
    
    .card {
      background: linear-gradient(145deg, #1e293b 0%, #334155 50%, #1e293b 100%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #f97316, #fb923c, #f97316);
    }
    
    .card-inner {
      padding: 32px 24px;
      position: relative;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo-box {
      display: inline-block;
      background: white;
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    
    .logo-box img {
      height: 56px;
      width: auto;
    }
    
    .discount-name {
      text-align: center;
      color: white;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    
    .discount-badge {
      text-align: center;
      margin: 24px 0;
    }
    
    .discount-badge-inner {
      display: inline-block;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      padding: 20px 48px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(249, 115, 22, 0.4);
      position: relative;
    }
    
    .discount-badge-inner::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, #fdba74, #f97316);
      border-radius: 18px;
      z-index: -1;
      opacity: 0.5;
    }
    
    .discount-label {
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .discount-value {
      color: white;
      font-size: 48px;
      font-weight: 900;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }
    
    .qr-section {
      text-align: center;
      margin: 28px 0;
    }
    
    .qr-box {
      display: inline-block;
      background: white;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    
    #qrcode {
      width: 120px;
      height: 120px;
    }
    
    #qrcode canvas {
      width: 100% !important;
      height: 100% !important;
    }
    
    .code-section {
      text-align: center;
      margin: 20px 0;
    }
    
    .code-label {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .code-box {
      display: inline-block;
      background: rgba(71, 85, 105, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 12px 32px;
      border-radius: 12px;
    }
    
    .code-value {
      color: white;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
    }
    
    .validity {
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .validity svg {
      width: 16px;
      height: 16px;
      color: #f97316;
    }
    
    .terms {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 16px;
      padding: 12px;
      background: rgba(51, 65, 85, 0.5);
      border-radius: 8px;
    }
    
    .actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    
    .btn-whatsapp {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: white;
    }
    
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
    }
    
    .btn-secondary {
      background: rgba(71, 85, 105, 0.5);
      color: white;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 0.7);
    }
    
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .footer {
      text-align: center;
      margin-top: 32px;
      color: #64748b;
      font-size: 13px;
    }
    
    .footer-logo {
      color: #f97316;
      font-weight: 700;
      font-size: 15px;
    }
    
    .loading {
      text-align: center;
      color: white;
      padding: 60px 20px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(249, 115, 22, 0.3);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      text-align: center;
      color: white;
      padding: 40px 20px;
    }
    
    .error h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .error p {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>جاري تحميل الكارد...</p>
      </div>
    </div>
    
    <div class="footer">
      <p class="footer-logo">BUTTER BAKERY</p>
      <p>شركة الزبد الأفضل التجارية</p>
    </div>
  </div>

  <script>
    // Get discount code from URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code') || window.location.pathname.split('/').pop();
    
    // API base URL - change this to your actual API URL
    const API_BASE = window.location.origin;
    
    async function loadDiscount() {
      const loadingEl = document.getElementById('loading');
      const cardEl = document.getElementById('card');
      
      if (!code || code === 'discount-standalone.html') {
        showError('الرجاء تحديد رمز الخصم في الرابط');
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/api/social-responsibility/discounts/code/${code}`);
        
        if (!response.ok) {
          throw new Error('الخصم غير موجود');
        }
        
        const discount = await response.json();
        renderCard(discount);
        
      } catch (error) {
        showError(error.message || 'حدث خطأ أثناء تحميل الخصم');
      }
    }
    
    function renderCard(discount) {
      const cardEl = document.getElementById('card');
      const discountDisplay = discount.discountType === 'percentage' 
        ? `${discount.discountValue}%` 
        : `${Number(discount.discountValue).toLocaleString()} ر.س`;
      
      const cardUrl = `${window.location.origin}/discount/${discount.code}`;
      
      cardEl.innerHTML = `
        <div class="card-inner">
          <div class="logo-container">
            <div class="logo-box">
              <img src="/butter-logo.png" alt="ButterBakery" onerror="this.parentElement.innerHTML='<span style=\\'color:#f97316;font-size:20px;font-weight:900\\'>BUTTER BAKERY</span>'">
            </div>
          </div>
          
          <h2 class="discount-name">${discount.name}</h2>
          
          <div class="discount-badge">
            <div class="discount-badge-inner">
              <div class="discount-label">خصم حصري</div>
              <div class="discount-value">${discountDisplay}</div>
            </div>
          </div>
          
          <div class="qr-section">
            <div class="qr-box">
              <div id="qrcode"></div>
            </div>
          </div>
          
          <div class="code-section">
            <div class="code-label">رمز الخصم</div>
            <div class="code-box">
              <span class="code-value">${discount.code}</span>
            </div>
          </div>
          
          <div class="validity">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            صالح حتى: <strong>${discount.validTo}</strong>
          </div>
          
          ${discount.terms ? `<div class="terms">${discount.terms}</div>` : ''}
        </div>
        
        <div style="padding: 0 24px 24px;">
          <div class="actions">
            <button class="btn btn-whatsapp" onclick="shareWhatsApp('${discount.code}', '${discount.name}', '${discountDisplay}', '${discount.validTo}')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg>
              مشاركة عبر واتساب
            </button>
            
            <div class="btn-row">
              <button class="btn btn-secondary" onclick="copyCode('${discount.code}')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                نسخ الرمز
              </button>
              <button class="btn btn-secondary" onclick="shareNative()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="18" cy="5" r="3"></circle>
                  <circle cx="6" cy="12" r="3"></circle>
                  <circle cx="18" cy="19" r="3"></circle>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
                مشاركة
              </button>
            </div>
          </div>
        </div>
      `;
      
      // Generate QR Code
      QRCode.toCanvas(document.querySelector('#qrcode'), cardUrl, {
        width: 120,
        margin: 0,
        color: { dark: '#1e293b', light: '#ffffff' }
      });
    }
    
    function showError(message) {
      const cardEl = document.getElementById('card');
      cardEl.innerHTML = `
        <div class="error">
          <h2>😕 عذراً</h2>
          <p>${message}</p>
        </div>
      `;
    }
    
    function shareWhatsApp(code, name, discount, validTo) {
      const message = `🎁 *كارد خصم من BUTTER BAKERY*\n\n` +
        `📍 ${name}\n` +
        `💰 خصم: ${discount}\n` +
        `🔖 الرمز: ${code}\n` +
        `📅 صالح حتى: ${validTo}\n\n` +
        `👆 اضغط على الرابط لعرض الكارد:\n${window.location.href}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
    }
    
    function copyCode(code) {
      navigator.clipboard.writeText(code).then(() => {
        alert('تم نسخ رمز الخصم: ' + code);
      });
    }
    
    function shareNative() {
      if (navigator.share) {
        navigator.share({
          title: 'كارد خصم من ButterBakery',
          url: window.location.href
        });
      }
    }
    
    // Load discount on page load
    loadDiscount();
  </script>
</body>
</html>
