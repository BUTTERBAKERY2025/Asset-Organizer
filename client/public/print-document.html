<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تجهيز المستند للطباعة…</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font-family: system-ui, 'Segoe UI', Tahoma, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #7a5c1e;
        font-size: 18px;
        background: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="msg">جارٍ تجهيز المستند للطباعة…</div>
    <!--
      صفحة وسيطة للطباعة. مُستثناة من سياسة الأمان (CSP) في الخادم
      (server/index.ts) لتعمل السكربتات المُضمَّنة داخل مستند الطباعة (ترقيم صفحات
      قرار المجلس + الطباعة التلقائية). النافذة الأصلية تكتب المستند في localStorage
      تحت مفتاح موجود في عنوان الـ hash، وهذه الصفحة تقرأه وتعرضه. نستخدم
      localStorage لأن سياسة COOP تمنع الوصول المباشر بين النوافذ.
    -->
    <script>
      (function () {
        var key = "";
        try { key = decodeURIComponent((location.hash || "").replace(/^#/, "")); } catch (e) {}
        var attempts = 0;
        function tryRender() {
          var html = null;
          try { html = key ? localStorage.getItem(key) : null; } catch (e) {}
          if (html) {
            try { localStorage.removeItem(key); } catch (e) {}
            // إزالة تنسيقات صفحة التجهيز (flex التوسيط) حتى لا تتسرب لمستند الطباعة
            try {
              var olds = document.querySelectorAll("style");
              for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
            } catch (e) {}
            document.open();
            document.write(html);
            document.close();
            return;
          }
          if (attempts++ < 480) {
            setTimeout(tryRender, 25); // حتى ~12 ثانية
          } else {
            var m = document.getElementById("msg");
            if (m) m.textContent = "تعذّر تحميل المستند. أغلق هذه النافذة وحاول مرة أخرى.";
          }
        }
        tryRender();
      })();
    </script>
  </body>
</html>
