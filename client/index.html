<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BUTTER BAKERY SYSTEM" />
    <meta name="theme-color" content="#d4a853" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:title" content="BUTTER BAKERY SYSTEM" />
    <meta property="og:description" content="CEO COMMAND" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/butter-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BUTTER BAKERY SYSTEM" />
    <meta name="twitter:description" content="CEO COMMAND" />
    <meta name="twitter:image" content="/butter-logo.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap&subset=arabic,latin" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap&subset=arabic,latin" rel="stylesheet" />
    </noscript>
    <style>
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
      .sk{background:linear-gradient(90deg,#e8e0d0 25%,#f0e8d8 50%,#e8e0d0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
      #initial-loader{min-height:100vh;background:#F5F0E6;font-family:system-ui,'Cairo',sans-serif;direction:rtl}
      .il-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px}
      .il-spin{width:36px;height:36px;border:3px solid #d4a853;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
      .il-text{font-size:13px;color:#92400e;opacity:0;transition:opacity .3s}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="il-wrap">
          <div class="il-spin"></div>
          <div class="il-text" id="il-msg"></div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function(){var m=document.getElementById('il-msg');if(m){m.textContent='جاري تحميل النظام...';m.style.opacity='1'}},800);
      setTimeout(function(){var m=document.getElementById('il-msg');if(m)m.textContent='جاري الاتصال بالخادم...'},3000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      }
    </script>
  </body>
</html>
