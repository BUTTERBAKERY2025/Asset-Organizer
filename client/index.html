<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BUTTER BAKERY SYSTEM" />
    <meta name="theme-color" content="#d4a853" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:title" content="BUTTER BAKERY SYSTEM" />
    <meta property="og:description" content="CEO COMMAND" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/butter-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BUTTER BAKERY SYSTEM" />
    <meta name="twitter:description" content="CEO COMMAND" />
    <meta name="twitter:image" content="/butter-logo.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
      .sk{background:linear-gradient(90deg,#e8e0d0 25%,#f0e8d8 50%,#e8e0d0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height:100vh;display:flex;background:#F5F0E6;font-family:'Cairo',sans-serif;direction:rtl">
        <div style="width:288px;background:#fff;border-left:1px solid #e8e0d0;padding:16px;display:none" id="il-side">
          <div class="sk" style="height:40px;border-radius:8px;margin-bottom:24px"></div>
          <div class="sk" style="height:36px;border-radius:8px;margin-bottom:12px"></div>
          <div class="sk" style="height:36px;border-radius:8px;margin-bottom:12px"></div>
          <div class="sk" style="height:36px;border-radius:8px;margin-bottom:12px"></div>
          <div class="sk" style="height:36px;border-radius:8px;margin-bottom:12px"></div>
          <div class="sk" style="height:36px;border-radius:8px;margin-bottom:12px"></div>
          <div class="sk" style="height:36px;border-radius:8px;margin-bottom:12px"></div>
        </div>
        <div style="flex:1;padding:24px">
          <div class="sk" style="height:32px;width:200px;border-radius:8px;margin-bottom:24px"></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
            <div class="sk" style="height:100px;border-radius:12px"></div>
            <div class="sk" style="height:100px;border-radius:12px"></div>
            <div class="sk" style="height:100px;border-radius:12px"></div>
          </div>
          <div class="sk" style="height:250px;border-radius:12px"></div>
        </div>
      </div>
    </div>
    <script>if(window.innerWidth>=768)document.getElementById('il-side').style.display='block'</script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(()=>{});
      }
    </script>
  </body>
</html>
