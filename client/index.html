<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BUTTER BAKERY SYSTEM" />
    <meta name="theme-color" content="#d4a853" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:title" content="BUTTER BAKERY SYSTEM" />
    <meta property="og:description" content="CEO COMMAND" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/butter-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BUTTER BAKERY SYSTEM" />
    <meta name="twitter:description" content="CEO COMMAND" />
    <meta name="twitter:image" content="/butter-logo.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap&subset=arabic,latin" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link rel="modulepreload" href="/src/main.tsx">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap&subset=arabic,latin" rel="stylesheet" />
    </noscript>
    <style>
      @font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:local('Cairo Regular'),local('Cairo-Regular')}
      @font-face{font-family:'Cairo';font-style:normal;font-weight:600;font-display:swap;src:local('Cairo SemiBold'),local('Cairo-SemiBold')}
      @font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:local('Cairo Bold'),local('Cairo-Bold')}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
      @keyframes loaderFadeOut{0%{opacity:1;transform:scale(1)}60%{opacity:0.3}100%{opacity:0;transform:scale(1.01);visibility:hidden;pointer-events:none}}
      @keyframes loaderPulse{0%,100%{opacity:1}50%{opacity:0.6}}
      @keyframes loaderSpinnerEntry{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
      .sk{background:linear-gradient(90deg,#e8e0d0 25%,#f0e8d8 50%,#e8e0d0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
      #initial-loader{min-height:100vh;background:#F5F0E6;font-family:'Cairo',system-ui,sans-serif;direction:rtl;transition:opacity .15s ease-out}
      #initial-loader.fade-out{animation:loaderFadeOut .25s ease-out forwards}
      .il-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px}
      .il-spin{width:30px;height:30px;border:2.5px solid #d4a853;border-top-color:transparent;border-radius:50%;animation:loaderSpinnerEntry .2s ease-out,spin .6s linear .2s infinite;will-change:transform}
      .il-text{font-size:13px;color:#92400e;opacity:0;transition:opacity .3s ease;animation:loaderPulse 2s ease-in-out 1.5s infinite}
    </style>
  </head>
  <body>
    <div id="nav-progress-bar"></div>
    <div id="root">
      <div id="initial-loader">
        <div class="il-wrap">
          <div class="il-spin"></div>
          <div class="il-text" id="il-msg"></div>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function(){var m=document.getElementById('il-msg');if(m){m.textContent='جاري تحميل النظام...';m.style.opacity='1'}},800);
      setTimeout(function(){var m=document.getElementById('il-msg');if(m)m.textContent='جاري الاتصال بالخادم...'},3000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      }
    </script>
  </body>
</html>
